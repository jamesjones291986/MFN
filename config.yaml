# Analysis settings
analysis:
  # Game version to focus on (filters data to this version only)
  target_version: "0.4.6"
  
  # Yards-to-goal-line bucket size for analysis
  ytgl_bucket_size: 5
  
  # Minimum play count for statistical significance
  min_play_count: 20
  
  # Thresholds for defensive analysis
  pass_threshold: 7
  run_threshold: 6
  
  # Play type definitions
  run_plays: ["Inside Run", "Outside Run"]
  pass_plays: ["Short Pass", "Medium Pass", "Long Pass"]
  
  # Excluded play types
  def_excludes: [null, "FG Block", "Punt Return", "Kick Return", "Onsides Kick Return Onside Kick Return"]
  off_excludes: [null, "Field Goal", "Punt", "Victory", "Kickoff", "Onsides Kick Onside Kick"]

# Output settings
output:
  # Whether to automatically save analysis results
  auto_save: true
  
  # Default output format for data exports
  default_format: csv
  
  # Include debug information in outputs
  debug_mode: false